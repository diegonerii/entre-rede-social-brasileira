apiVersion: v1
kind: Namespace
metadata:
  name: entre
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: entre-data
  namespace: entre
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: entre
  namespace: entre
  labels:
    app: entre
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: entre
  template:
    metadata:
      labels:
        app: entre
    spec:
      containers:
        - name: entre
          image: container-registry.br-se1.magalu.cloud/entre/entre:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8787
          env:
            - name: PORT
              value: "8787"
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 1
              memory: 2Gi
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: entre-data
---
apiVersion: v1
kind: Service
metadata:
  name: entre
  namespace: entre
spec:
  type: LoadBalancer
  selector:
    app: entre
  ports:
    - name: http
      port: 80
      targetPort: http
